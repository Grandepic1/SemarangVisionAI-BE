# Semarang Vision AI — run the API in Docker.
#
#   docker compose up --build -d
#   open http://localhost:9002/docs
#
# The API needs no database at runtime: it reads data/cctvs.json (kept fresh
# by the in-app daily scraper) and calls the TomTom + CCTV stream APIs directly.
# SQLAlchemy/alembic are present for migrations only and are not exercised here.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: semarangvision-be:latest
    container_name: semarangvision-api
    restart: unless-stopped
    ports:
      - "9002:9002"
    # .env is also baked into the image at build time (Dockerfile COPY), so
    # these runtime values override the baked ones if you edit .env later.
    env_file:
      - .env   # includes TOM_API_KEY, SCHEDULER_ENABLED, SCRAPE_TIMEZONE, ...
    environment:
      # Deterministic: overrides whatever .env says. The image bakes the model
      # at exactly this path (see the Dockerfile COPY).
      ANOMALY_MODEL_PATH: models/best.pt
    volumes:
      # data/cctvs.json is rewritten daily by the in-app scheduler (02:00 WIB).
      # A named volume persists those updates across rebuilds and avoids
      # bind-mount permission issues on Linux hosts. Docker named volumes are
      # directories, so they mount on /app/data (not the file itself); on first
      # run the volume is seeded from the image's data/cctvs.json. Inspect with:
      #   docker compose exec api cat /app/data/cctvs.json
      - cctvs_data:/app/data
      # Optional: override the baked-in model with your own weights.
      # Drop a new best.pt into ./models, then uncomment:
      # - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cctvs_data:
