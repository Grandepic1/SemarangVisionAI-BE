[project]
name = "semarangvision-be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.5",
    "apscheduler>=3.11.3",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "torch>=2.13.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.115",
    "uvicorn>=0.52.1",
]

# Use CUDA-enabled torch builds from the PyTorch index (instead of the
# CPU-only wheels from PyPI). Change the url to cu12x/cu13x to match your
# driver's CUDA version, or remove [tool.uv.sources] to revert to CPU torch.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

